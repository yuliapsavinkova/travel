<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E1" />
      <stop offset="45%" stop-color="#E5C185" />
      <stop offset="100%" stop-color="#B08D57" />
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1813" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
  </defs>

  <!-- High-contrast dark background disc with rounded clip for clean SERP rendering -->
  <circle cx="50" cy="50" r="48" fill="url(#bg-glow)" stroke="url(#gold-grad)" stroke-width="2.5" />

  <!-- Clean, bold vector globe grid (thick enough to stay razor sharp when scaled to 16x16 or 48x48) -->
  <!-- Outer Globe Sphere -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" />

  <!-- Center Axis / Equator -->
  <line x1="50" y1="12" x2="50" y2="88" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="12" y1="50" x2="88" y2="50" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Main Meridians (Primary Curves) -->
  <ellipse cx="50" cy="50" rx="16" ry="38" fill="none" stroke="url(#gold-grad)" stroke-width="2.2" />

  <!-- Parallels (Latitude Curves) -->
  <path d="M 18 34 C 28 30, 72 30, 82 34" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" />
  <path d="M 18 66 C 28 70, 72 70, 82 66" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" />
</svg>

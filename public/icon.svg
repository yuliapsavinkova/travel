<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C7334" />
      <stop offset="50%" stop-color="#845D25" />
      <stop offset="100%" stop-color="#6E4B19" />
    </linearGradient>
    <clipPath id="globe-inner-clip">
      <circle cx="50" cy="50" r="44" />
    </clipPath>
  </defs>

  <!-- Outer Sphere Ring (Completely Transparent Center) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#fav-gold-grad)" stroke-width="6" />

  <!-- Interior Globe Grid (Transparent, Precision Vector Geometry) -->
  <g clip-path="url(#globe-inner-clip)" fill="none" stroke="url(#fav-gold-grad)">
    <!-- Polar Axis -->
    <line x1="50" y1="0" x2="50" y2="100" stroke-width="5" />

    <!-- Equator -->
    <line x1="0" y1="50" x2="100" y2="50" stroke-width="5" />

    <!-- Prime Meridian Ellipse -->
    <ellipse cx="50" cy="50" rx="22" ry="46" stroke-width="4.5" />

    <!-- Outer Longitude Ellipse -->
    <ellipse cx="50" cy="50" rx="36" ry="46" stroke-width="4" opacity="0.9" />

    <!-- Upper Latitude Parallel -->
    <path d="M 0 31 Q 50 24 100 31" stroke-width="4.5" stroke-linecap="round" />

    <!-- Lower Latitude Parallel -->
    <path d="M 0 69 Q 50 76 100 69" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>

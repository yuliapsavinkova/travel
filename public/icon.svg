
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE79C" />
      <stop offset="45%" stop-color="#D8B446" />
      <stop offset="100%" stop-color="#9E7422" />
    </linearGradient>
    <radialGradient id="darkDisc" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2A2722" />
      <stop offset="100%" stop-color="#131210" />
    </radialGradient>
    <clipPath id="discClip">
      <circle cx="50" cy="50" r="42" />
    </clipPath>
  </defs>
  
  <!-- Outer transparent padding, circular dark medallion -->
  <circle cx="50" cy="50" r="47" fill="url(#darkDisc)" stroke="url(#goldGrad)" stroke-width="3.8" />
  
  <!-- Inner Globe circle -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  
  <g clip-path="url(#discClip)" fill="none" stroke="url(#goldGrad)">
    <!-- Polar axis -->
    <line x1="50" y1="10" x2="50" y2="90" stroke-width="4" />
    <!-- Equator -->
    <line x1="10" y1="50" x2="90" y2="50" stroke-width="4" />
    <!-- Prime meridian -->
    <ellipse cx="50" cy="50" rx="20" ry="39" stroke-width="4" />
    
    <ellipse cx="50" cy="50" rx="31" ry="39" stroke-width="3" opacity="0.8" />
    <path d="M 14 34 Q 50 28 86 34" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 14 66 Q 50 72 86 66" stroke-width="3.2" stroke-linecap="round" />
    
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="35%" stop-color="#F2D8A7" />
      <stop offset="75%" stop-color="#DDAF68" />
      <stop offset="100%" stop-color="#B88A44" />
    </linearGradient>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211C" />
      <stop offset="100%" stop-color="#0F0E0C" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Solid rounded base circle with subtle gold rim for perfect contrast on light/dark browser chrome -->
  <circle cx="50" cy="50" r="47" fill="url(#fav-bg)" stroke="url(#fav-gold)" stroke-width="2.5" />

  <!-- Crisp, optimized globe geometry matching header icon aesthetic -->
  <g filter="url(#fav-glow)">
    <!-- Outer Globe Boundary -->
    <circle cx="50" cy="50" r="37" fill="none" stroke="url(#fav-gold)" stroke-width="2.8" />

    <!-- Center Axes -->
    <line x1="50" y1="13" x2="50" y2="87" stroke="url(#fav-gold)" stroke-width="2.6" stroke-linecap="round" />
    <line x1="13" y1="50" x2="87" y2="50" stroke="url(#fav-gold)" stroke-width="2.6" stroke-linecap="round" />

    <!-- Primary Meridian Curves -->
    <ellipse cx="50" cy="50" rx="15.5" ry="37" fill="none" stroke="url(#fav-gold)" stroke-width="2.4" />

    <!-- Secondary Outer Meridian Curves -->
    <ellipse cx="50" cy="50" rx="27" ry="37" fill="none" stroke="url(#fav-gold)" stroke-width="1.6" opacity="0.6" />

    <!-- Latitude Parallels -->
    <path d="M 18 35 C 28 32, 72 32, 82 35" fill="none" stroke="url(#fav-gold)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 18 65 C 28 68, 72 68, 82 65" fill="none" stroke="url(#fav-gold)" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>

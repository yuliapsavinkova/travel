<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="25%" stop-color="#FEE0A6" />
      <stop offset="65%" stop-color="#E5C185" />
      <stop offset="100%" stop-color="#B88A44" />
    </linearGradient>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1A17" />
      <stop offset="100%" stop-color="#090807" />
    </linearGradient>
    <radialGradient id="fav-inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDAF68" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <clipPath id="globe-clip">
      <circle cx="50" cy="50" r="47.5" />
    </clipPath>
  </defs>

  <!-- Full-blown Globe: Outer circle IS the globe boundary itself (touches edges 0 and 100) -->
  <circle cx="50" cy="50" r="47.5" fill="url(#fav-bg)" stroke="url(#fav-gold)" stroke-width="5" />
  <circle cx="50" cy="50" r="47.5" fill="url(#fav-inner-glow)" />

  <!-- Clean, bold globe lines (no thin lines, no double circles) -->
  <g clip-path="url(#globe-clip)" fill="none" stroke="url(#fav-gold)">
    <!-- Central Polar Axis -->
    <line x1="50" y1="0" x2="50" y2="100" stroke-width="4.5" />
    <!-- Equator -->
    <line x1="0" y1="50" x2="100" y2="50" stroke-width="4.5" />
    <!-- Prime Meridian -->
    <ellipse cx="50" cy="50" rx="22" ry="47.5" stroke-width="4.2" />
    <!-- Upper Latitude -->
    <path d="M 0 31 Q 50 23 100 31" stroke-width="4" />
    <!-- Lower Latitude -->
    <path d="M 0 69 Q 50 77 100 69" stroke-width="4" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="25%" stop-color="#FEE0A6" />
      <stop offset="65%" stop-color="#E5C185" />
      <stop offset="100%" stop-color="#B88A44" />
    </linearGradient>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1A17" />
      <stop offset="100%" stop-color="#090807" />
    </linearGradient>
    <radialGradient id="fav-inner-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDAF68" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Globe Outer Sphere (The globe itself forms the outer boundary - no outer 2 rings) -->
  <circle cx="50" cy="50" r="47.5" fill="url(#fav-bg)" stroke="url(#fav-gold)" stroke-width="4.5" />
  <circle cx="50" cy="50" r="47.5" fill="url(#fav-inner-glow)" />

  <!-- Central Polar Axis -->
  <line x1="50" y1="3" x2="50" y2="97" stroke="url(#fav-gold)" stroke-width="4" stroke-linecap="round" />

  <!-- Horizontal Equator -->
  <line x1="3" y1="50" x2="97" y2="50" stroke="url(#fav-gold)" stroke-width="4" stroke-linecap="round" />

  <!-- Prime Meridian (Center Ellipse) -->
  <ellipse cx="50" cy="50" rx="21.3" ry="47.5" fill="none" stroke="url(#fav-gold)" stroke-width="3.8" />

  <!-- Outer Meridian (Curved Longitude) -->
  <ellipse cx="50" cy="50" rx="36.6" ry="47.5" fill="none" stroke="url(#fav-gold)" stroke-width="3" opacity="0.85" />

  <!-- Upper Latitude Parallel -->
  <path d="M 10.8 30.4 C 24.4 25.3, 75.6 25.3, 89.2 30.4" fill="none" stroke="url(#fav-gold)" stroke-width="3.4" stroke-linecap="round" />

  <!-- Lower Latitude Parallel -->
  <path d="M 10.8 69.6 C 24.4 74.7, 75.6 74.7, 89.2 69.6" fill="none" stroke="url(#fav-gold)" stroke-width="3.4" stroke-linecap="round" />
</svg>
